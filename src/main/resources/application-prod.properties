spring.datasource.url=${DB_URL:jdbc:h2:file:./data/bookstore}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Seed only when you ask for it (first run: DB_INIT_MODE=always, then remove it)
spring.sql.init.mode=${DB_INIT_MODE:never}
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

spring.h2.console.enabled=false
spring.thymeleaf.cache=true

logging.level.root=WARN
logging.level.com.d4xaris.bookstore=INFO